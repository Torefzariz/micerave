<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save the date</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #555;
            font-family: 'Courier New', Courier, monospace;
        }
        #instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none; /* Let mouse pass through to canvas */
            user-select: none;
            z-index: 10;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="instruction">Save the date: Oct 2 2026. <br> Please fill your name and your +1. <br><br>Type to create. Drag to throw. [SPACE] to explode.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
    // --- SETUP MATTER.JS ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Mouse = Matter.Mouse,
          MouseConstraint = Matter.MouseConstraint,
          Events = Matter.Events,
          Body = Matter.Body;

    // Create engine
    const engine = Engine.create();
    const world = engine.world;

    // Create renderer
    const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth,
            height: window.innerHeight,
            background: '#1a1a1a',
            wireframes: false // We want solid shapes
        }
    });

    // --- WALLS ---
    function createWalls() {
        const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 30, window.innerWidth, 60, { isStatic: true });
        const leftWall = Bodies.rectangle(-30, window.innerHeight / 2, 60, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 30, window.innerHeight / 2, 60, window.innerHeight, { isStatic: true });
        Composite.add(world, [ground, leftWall, rightWall]);
    }
    createWalls();

    // --- INTERACTION ---
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: {
            stiffness: 0.2,
            render: { visible: false }
        }
    });
    Composite.add(world, mouseConstraint);
    render.mouse = mouse; // Sync mouse with renderer

    // --- CUSTOM TEXT RENDERING ---
    // Matter.js draws shapes, but not text. We hook into the rendering loop to draw text on top.
    Events.on(render, 'afterRender', function() {
        const context = render.context;
        const bodies = Composite.allBodies(world);

        context.font = "bold 40px Arial";
        context.textAlign = "center";
        context.textBaseline = "middle";

        bodies.forEach(body => {
            // Only draw text if the body has a 'char' property (ignoring walls)
            if (body.char) {
                const { x, y } = body.position;
                const angle = body.angle;

                context.save();
                context.translate(x, y);
                context.rotate(angle);
                context.fillStyle = "#ffffff";
                context.fillText(body.char, 0, 2); // Slight offset for visual centering
                context.restore();
            }
        });
    });

    // --- LOGIC: CREATE LETTERS ---
    function spawnLetter(char) {
        // Random x position near the top
        const x = Math.random() * (window.innerWidth - 100) + 50;
        const y = -50; 
        
        // Create a box for the letter
        // You can change 'rectangle' to 'circle' if you prefer bubbles
        const letterBody = Bodies.circle(x, y, 28, {
            restitution: 0.8, // Bounciness (0-1)
            friction: 0.5,
            render: {
                fillStyle: '#333', // Dark grey bubble
                strokeStyle: '#555',
                lineWidth: 2
            }
        });

        // Tag the body with the character so we can render it later
        letterBody.char = char;

        // Add random rotation force for chaos
        Body.setAngularVelocity(letterBody, (Math.random() - 0.5) * 0.2);

        Composite.add(world, letterBody);
    }

    // --- EXPLOSION (Zero Gravity) ---
    function explode() {
        const bodies = Composite.allBodies(world);
        bodies.forEach(body => {
            if (!body.isStatic) {
                // Apply a random upward force
                Body.applyForce(body, body.position, {
                    x: (Math.random() - 0.5) * 0.2,
                    y: -0.2 // Shoot up
                });
            }
        });
    }

    // --- INPUT LISTENERS ---
    document.addEventListener('keydown', (e) => {
        // Prevent default scrolling for Space
        if (e.code === 'Space') {
            e.preventDefault();
            explode();
            return;
        }

        // Only print single characters (A-Z, 0-9, etc)
        if (e.key.length === 1) {
            spawnLetter(e.key);
        }
        
        // Backspace: Remove the last added body (optional, but nice)
        if (e.key === 'Backspace') {
            const bodies = Composite.allBodies(world);
            // Find the last non-static body
            for (let i = bodies.length - 1; i >= 0; i--) {
                if (!bodies[i].isStatic) {
                    Composite.remove(world, bodies[i]);
                    break;
                }
            }
        }
    });

    // Handle Resize
    window.addEventListener('resize', () => {
        render.canvas.width = window.innerWidth;
        render.canvas.height = window.innerHeight;
        // Re-create walls (simplest way to handle resize)
        Composite.clear(world, false, true); // Keep bodies, remove static
        createWalls();
        Composite.add(world, mouseConstraint);
    });

    // --- START ---
    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

</script>
</body>
</html>
