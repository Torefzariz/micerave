<!DOCTYPE html>
<html>
<head>
    <title>~*~ MOUSE SURVIVORS RAVE CAVE ~*~</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://media.giphy.com/media/4BiWnG2J8ryOAtFSZ8/giphy.gif" type="image/gif">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* The iframe handles the scroll */
            background-color: black;
        }

        /* The Window that shows your actual pages */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* THE DJ BUTTON - NOW LIVES HERE FOREVER */
        .dj-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999; /* Sits on top of the iframe */
            background-color: #000000;
            color: #00ff00;
            border: 4px ridge #ff00ff;
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            cursor: pointer;
            animation: pulse-scale 0.4s infinite alternate;
        }

        .dj-button:active {
            background-color: #ff00ff;
            color: black;
        }

        /* THE "FIX MY SHOULDER" BUTTON */
        .pt-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            background-color: #000000;
            color: #00ffff;
            border: 4px ridge #0000ff;
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            cursor: pointer;
            animation: pulse-bounce 0.5s infinite alternate;
        }

        .pt-button:active {
            background-color: #00ffff;
            color: black;
        }

        /* "MOM'S ACCURATE 3D SCAN" BUTTON (TOP LEFT) */
        .scan-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background-color: #000000;
            color: #ff007f;
            border: 4px ridge #ff007f;
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            cursor: pointer;
            animation: pulse-glow 0.6s infinite alternate;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .scan-button:active {
            background-color: #ff007f;
            color: black;
        }

        /* ANIMATIONS */
        @keyframes pulse-scale {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        @keyframes pulse-bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        @keyframes pulse-glow {
            from {
                transform: scale(1);
                box-shadow: 0 0 5px rgba(255, 0, 127, 0.4);
            }
            to {
                transform: scale(1.05);
                box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            }
        }

        /* MOBILE RESPONSIVENESS ADJUSTMENTS */
        @media only screen and (max-width: 600px) {
            .dj-button, .pt-button, .scan-button {
                font-size: 12px;
                padding: 8px 12px;
                border-width: 3px;
            }
            /* Move positioning in slightly so they don't clip off mobile borders */
            .dj-button { bottom: 10px; right: 10px; }
            .pt-button { bottom: 10px; left: 10px; }
            .scan-button { top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

    <audio id="raveMusic" loop>
        <source src="rave.mp3" type="audio/mpeg">
    </audio>

    <!-- NEW BUTTON (Top Left) -->
    <button class="scan-button" onclick="loadThreeDScan()">💀 MOM'S ACCURATE 3D SCAN</button>

    <!-- EXISTING BUTTONS (Bottom Left / Bottom Right) -->
    <button class="pt-button" onclick="fixMyShoulder()">🏋️‍♂️ FIX MY SHOULDER</button>
    <button class="dj-button" onclick="toggleMusic()">🔊 START THE PARTY</button>

    <iframe id="content-frame" src="home.html" name="content-frame"></iframe>

    <script>
        var music = document.getElementById("raveMusic");
        var btn = document.querySelector(".dj-button");
        var isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                btn.innerHTML = "🔊 RESUME RAVE";
                btn.style.animation = "none";
                isPlaying = false;
            } else {
                music.play();
                btn.innerHTML = "🔇 STOP THE NOISE";
                btn.style.animation = "pulse-scale 0.4s infinite alternate";
                isPlaying = true;
            }
        }

        // Switches frame to the PT Shoulder Tracker!
        function fixMyShoulder() {
            var frame = document.getElementById("content-frame");
            frame.src = "pt.html"; 
        }

        // NEW FUNCTION: Switches frame to your interactive 3D Model!
        function loadThreeDScan() {
            var frame = document.getElementById("content-frame");
            frame.src = "bodybuilder.html"; // Changed to match your file name!
        }
    </script>

</body>
</html>
